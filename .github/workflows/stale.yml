name: Stale Issues and PRs

on:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          stale-issue-message: 'This issue has been inactive for 30 days. It will be closed in 7 days if no activity occurs. Comment to keep it open.'
          stale-pr-message: 'This PR has been inactive for 14 days. It will be closed in 7 days if no activity. Push a commit or comment to keep it open.'
          close-issue-message: 'Closed due to inactivity. Reopen if still relevant.'
          close-pr-message: 'Closed due to inactivity. Reopen if still relevant.'
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,epic'
          exempt-pr-labels: 'pinned,security'
